<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <title>Waterloo Timeline</title>

    <!-- Leaflet CSS & JS (Standard) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map { height: 600px; width: 100%; }

        /* French Column 2D Shape */
        .french-column {
            background-color: #002395;
            border: 2px solid white;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
            border-radius: 2px;
        }

        .controls { margin: 15px 0; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Battle Movement Simulation</h2>
    
    <div class="controls">
        <button id="start-btn">Start Advance</button>
        <button id="pause-btn">Pause</button>
    </div>

    <div id="map"></div>

    <script>
        const map = L.map('map').setView([50.6781, 4.4121], 14);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const pathCoordinates = [
            [50.6750, 4.4080],
            [50.6775, 4.4110],
            [50.6810, 4.4140],
            [50.6840, 4.4190]
        ];

        L.polyline(pathCoordinates, { color: 'blue', weight: 3, dashArray: '5, 10' }).addTo(map);

        const frenchUnitIcon = L.divIcon({
            className: 'french-column',
            iconSize: [40, 20],
            iconAnchor: [20, 10]
        });

        const unitMarker = L.marker(pathCoordinates[0], { icon: frenchUnitIcon }).addTo(map);

        let animationFrameId = null;
        let isPlaying = false;
        let currentSegment = 0;
        let segmentProgress = 0;

        const segmentDurations = [3000, 4000, 5000]; 
        let lastTimestamp = null;

        function animate(timestamp) {
            if (!isPlaying) return;
            if (!lastTimestamp) lastTimestamp = timestamp;

            const deltaTime = timestamp - lastTimestamp;
            lastTimestamp = timestamp;

            const currentDuration = segmentDurations[currentSegment];
            segmentProgress += deltaTime / currentDuration;

            if (segmentProgress >= 1.0) {
                segmentProgress = 0;
                currentSegment++;

                if (currentSegment >= pathCoordinates.length - 1) {
                    unitMarker.setLatLng(pathCoordinates[pathCoordinates.length - 1]);
                    isPlaying = false;
                    return;
                }
            }

            const startPt = pathCoordinates[currentSegment];
            const endPt = pathCoordinates[currentSegment + 1];

            const currentLat = startPt[0] + (endPt[0] - startPt[0]) * segmentProgress;
            const currentLng = startPt[1] + (endPt[1] - startPt[1]) * segmentProgress;

            unitMarker.setLatLng([currentLat, currentLng]);

            animationFrameId = requestAnimationFrame(animate);
        }

        document.getElementById('start-btn').addEventListener('click', function() {
            if (!isPlaying) {
                if (currentSegment >= pathCoordinates.length - 1) {
                    // Reset if finished
                    currentSegment = 0;
                    segmentProgress = 0;
                }
                isPlaying = true;
                lastTimestamp = null;
                animationFrameId = requestAnimationFrame(animate);
            }
        });

        document.getElementById('pause-btn').addEventListener('click', function() {
            isPlaying = false;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
        });
    </script>
</body>
</html>
